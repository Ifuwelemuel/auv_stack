/pca9685_driver:
  ros__parameters:
    i2c_bus: 7
    i2c_addr: 0x40
    pitch_channel: 0
    yaw_channel: 1
    thruster_channel: 3
    fin_centre_us: 825
    fin_span_us: 325
    fin_max_rad: 0.5
    pitch_sign: 1        # measured: 1500us = nose up = positive
    yaw_sign: 1         # measured: 1500us = positive
    thruster_stop_us: 1480
    thruster_span_us: 200 # max 400